name: merfish-benchmark
channels:
  - conda-forge
dependencies:
  # Linux, CUDA 12 workstation. SpatialScope uses its own Python 3.9 environment.
  - python=3.12
  - pip>=24
  - ipykernel
  - jupyterlab
  - numpy>=1.26,<3
  - pandas>=2.2,<3
  - scipy>=1.13,<2
  - scikit-learn>=1.4,<2
  - matplotlib>=3.8,<4
  - h5py>=3.11
  - pyyaml
  - pip:
      - scvi-tools[cuda,diagvi]==1.5.1
      - scviva-tools==0.1.7
      - scanpy==1.12.4
      - anndata>=0.11,<0.13
      - tangram-sc==1.0.4
      - squidpy>=1.8,<1.9
      - uniport==1.3
